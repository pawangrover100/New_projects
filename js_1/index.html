<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather_Website</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <div class="search">
        <input type="text" placeholder="Enter Your City" spellcheck="false" />
        <button><img src="images/search.png" alt="Remove in Folder" /></button>
      </div>
      <div class="error">
        <p>Inviald City Name</p>
      </div>
      <div class="weather">
        <img
          src="images/rain.png"
          alt="remove in folder"
          class="weather_icon"
        />
        <h1 class="temp">16°C</h1>
        <h2 class="city">New Delhi</h2>
        <div class="details">
          <div class="col">
            <img src="images/humidity.png" alt="remove in folder" />
            <div>
              <p class="humidity">50%</p>
              <p>Humidity</p>
            </div>
          </div>
          <div class="col">
            <img src="images/wind.png" alt="remove in folder" />
            <div>
              <p class="wind">15 km/h</p>
              <p>Wind Speed</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const apiKey = "PASTE_YOUR_NEW_API_KEY_HERE";

      const apiUrl =
        "https://api.openweathermap.org/data/2.5/weather?units=metric&q=";

      const searchBox = document.querySelector(".search input");
      const searchBtn = document.querySelector(".search button");
      const weatherIcon = document.querySelector(".weather_icon");

      async function checkWeather(city) {
        if (!city) return;

        try {
          const response = await fetch(apiUrl + city + `&appid=${apiKey}`);

          // If API gives error
          if (!response.ok) {
            document.querySelector(".error").style.display = "block";
            document.querySelector(".weather").style.display = "none";
            return;
          }

          const Data = await response.json();

          // Update UI
          document.querySelector(".city").innerHTML = Data.name;
          document.querySelector(".temp").innerHTML =
            Math.round(Data.main.temp) + "°C";
          document.querySelector(".humidity").innerHTML =
            Data.main.humidity + "%";
          document.querySelector(".wind").innerHTML = Data.wind.speed + " km/h";

          // Change icon
          const condition = Data.weather[0].main;

          if (condition === "Clouds") {
            weatherIcon.src = "images/clouds.png";
          } else if (condition === "Clear") {
            weatherIcon.src = "images/clear.png";
          } else if (condition === "Rain") {
            weatherIcon.src = "images/rain.png";
          } else if (condition === "Drizzle") {
            weatherIcon.src = "images/drizzle.png";
          } else if (condition === "Mist") {
            weatherIcon.src = "images/mist.png";
          }

          document.querySelector(".weather").style.display = "block";
          document.querySelector(".error").style.display = "none";
        } catch (err) {
          console.error(err);
          document.querySelector(".error").style.display = "block";
          document.querySelector(".weather").style.display = "none";
        }
      }

      // Button click
      searchBtn.addEventListener("click", () => {
        checkWeather(searchBox.value.trim());
      });

      // Enter key press
      searchBox.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          checkWeather(searchBox.value.trim());
        }
      });
    </script>
  </body>
</html>
